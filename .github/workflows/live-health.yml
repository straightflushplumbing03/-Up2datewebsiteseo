name: Live site health

# Daily check of the LIVE site: homepage (name + phone), robots.txt AI-bot
# access (no Disallow: / for AI crawlers, no Cloudflare Managed block) and
# llms.txt, plus security headers and whether Cloudflare is in front (both
# informational, warn-only). Runs before the 5:37 AM Pacific Claude daily, which reads this
# run's result through the GitHub connector instead of WebFetch (WebFetch
# permission prompts go unanswered in unattended scheduled runs).
#
# Job fails only on a definite problem; a Cloudflare challenge on the runner
# is reported as `inconclusive`, never as a failure.

on:
  schedule:
    - cron: "7 12 * * *"   # 12:07 UTC = 4:07–5:07 AM Pacific, before the daily run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Homepage, robots.txt, llms.txt, security headers, Cloudflare edge
        run: python3 scripts/live_health_check.py
      - name: Crawler user-agent access (informational)
        if: always()
        continue-on-error: true
        run: bash growth-engine/tests/crawler_access_check.sh
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Live site health"
            echo '```json'
            cat live-health.json 2>/dev/null || echo "no result file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-health
          path: live-health.json

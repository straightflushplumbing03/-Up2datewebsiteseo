name: Purge Cloudflare cache after deploy

# Runs after each GitHub Pages build so Cloudflare's cached HTML never goes stale.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - API token with Zone > Cache Purge permission for straightflushplumbingoc.com
#   CLOUDFLARE_ZONE_ID    - Zone ID from the domain's Overview page in Cloudflare
# If either secret is missing, the job skips without failing.
on:
  page_build:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge everything
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ZONE" ]; then
            echo "Cloudflare secrets not set; skipping purge."; exit 0
          fi
          sleep 30  # give GitHub Pages a moment to finish publishing
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee /tmp/out.json
          grep -q '"success":true' /tmp/out.json

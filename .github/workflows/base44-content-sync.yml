name: Base44 Content Sync

# Triggered by the Cloudflare Worker when Base44 generates new content.
# The Worker calls /api/content which fires a repository_dispatch event
# with event_type: base44_content_sync
#
# Expected client_payload shape:
# {
#   "path": "cities/new-city.html",   // relative path for the new file
#   "content": "<html>...</html>"     // full HTML content to write
# }

on:
  repository_dispatch:
    types: [base44_content_sync]

jobs:
  sync-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate payload
        id: validate
        run: |
          FILE_PATH="${{ github.event.client_payload.path }}"
          # Only allow HTML files in safe directories
          if [[ ! "$FILE_PATH" =~ ^(cities|services|academy|guides|insurance)/[a-z0-9_-]+\.html$ ]]; then
            echo "ERROR: Invalid or unsafe path: $FILE_PATH"
            exit 1
          fi
          echo "path=$FILE_PATH" >> "$GITHUB_OUTPUT"

      - name: Write content file
        run: |
          FILE_PATH="${{ steps.validate.outputs.path }}"
          mkdir -p "$(dirname "$FILE_PATH")"
          cat > "$FILE_PATH" << 'EOF_MARKER'
          ${{ github.event.client_payload.content }}
          EOF_MARKER
          # Remove the leading whitespace added by the heredoc indentation
          sed -i 's/^          //' "$FILE_PATH"

      - name: Commit and push
        run: |
          git config user.name  "base44-sync[bot]"
          git config user.email "base44-sync[bot]@users.noreply.github.com"
          git add "${{ steps.validate.outputs.path }}"
          git diff --staged --quiet || git commit -m "content: add ${{ steps.validate.outputs.path }} via Base44 sync"
          git push
